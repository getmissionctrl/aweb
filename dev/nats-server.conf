# NATS Server Configuration for aweb development
# Start with: nats-server -c dev/nats-server.conf

listen: 127.0.0.1:12003

# HTTP monitoring
http_port: 12004

# JetStream configuration
jetstream {
  store_dir: ".data/nats"
  max_mem: 256MB
  max_file: 1GB
}

# Auth callout disabled for dev — enable when the Haskell handler is implemented.
# authorization {
#   auth_callout {
#     issuer: "aweb-dev"
#     auth_users: ["aweb-auth"]
#     account: "$G"
#   }
# }

# Logging
logfile: ".data/nats/nats.log"
debug: false
trace: false

# Limits
max_payload: 1MB
max_connections: 256
